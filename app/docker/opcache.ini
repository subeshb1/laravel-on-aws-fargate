; Worker mode means the same PHP processes serve thousands of requests, so
; opcache should compile once and then never look at the filesystem again.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; The application code cannot change inside an immutable container image, so
; there is nothing to revalidate on disk. This is the single biggest win here,
; and it is only safe because the image is immutable.
opcache.validate_timestamps=0

realpath_cache_size=4096K
realpath_cache_ttl=600
